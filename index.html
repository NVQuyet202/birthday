<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Chúc mừng sinh nhật ♡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Quicksand:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg1: #ffeef5;
        --bg2: #efe6ff;
        --bg3: #e2f5ef;
        --ink: #8a4f6d;
        --hand: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
        --fancy: "Great Vibes", "Dancing Script", cursive;
        --sans: "Quicksand", system-ui, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg1: #2a2040;
          --bg2: #3a2a55;
          --bg3: #223b45;
          --ink: #ffdcec;
        }
      }
      :root[data-theme="dark"] {
        --bg1: #2a2040;
        --bg2: #3a2a55;
        --bg3: #223b45;
        --ink: #ffdcec;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: var(--sans);
        color: var(--ink);
        background: linear-gradient(
            155deg,
            var(--bg1),
            var(--bg2) 55%,
            var(--bg3)
          )
          fixed;
        overflow-x: hidden;
      }
      #root {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      button {
        font-family: inherit;
      }

      /* bay lơ lửng nền */
      .fl-wrap {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }
      .fl {
        position: absolute;
        bottom: -40px;
        color: #ff9fc2;
        opacity: 0;
        animation: rise linear infinite;
      }
      @keyframes rise {
        0% {
          transform: translateY(0) rotate(0);
          opacity: 0;
        }
        10%,
        85% {
          opacity: 0.7;
        }
        100% {
          transform: translateY(-115vh) rotate(300deg);
          opacity: 0;
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes grow {
        to {
          transform: scale(1);
        }
      }

      /* mở đầu */
      .intro,
      .stage,
      .again {
        position: relative;
        z-index: 1;
      }
      .intro {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 40px 64px;
        padding: 36px 20px;
        animation: fadeUp 0.8s ease both;
      }
      .ititle {
        text-align: center;
        max-width: 430px;
      }
      .kicker {
        font: 700 1.05rem var(--sans);
        letter-spacing: 0.14em;
        margin: 0 0 2px;
        opacity: 0.85;
      }
      h1 {
        font: 400 clamp(3.8rem, 14vw, 6.6rem) / 1.05 var(--fancy);
        margin: 0;
        color: #ff7fae;
        text-shadow: 0 2px 0 #fff, 0 0 28px rgba(255, 160, 200, 0.85);
      }
      .w {
        display: block;
        white-space: nowrap;
      }
      .ch {
        display: inline-block;
        animation: chin 0.9s cubic-bezier(0.2, 1.5, 0.4, 1) both;
      }
      @keyframes chin {
        from {
          opacity: 0;
          transform: translateY(26px) scale(0.4) rotate(-12deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .isub {
        font: 700 1.8rem var(--hand);
        margin: 10px 0 24px;
        animation: fadeUp 1s ease 1.2s both;
      }
      .btn {
        border: 0;
        cursor: pointer;
        font: 700 1.1rem var(--sans);
        color: #fff;
        padding: 14px 32px;
        border-radius: 999px;
        background: linear-gradient(120deg, #ff8fb8, #c3a6f5);
        box-shadow: 0 10px 24px rgba(255, 120, 170, 0.4);
        animation: pulse 2s ease-in-out 2s infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.06);
        }
      }

      /* lịch */
      .cal {
        width: 250px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(200, 110, 160, 0.3);
        transform-origin: 50% -12px;
        animation: swing 5s ease-in-out infinite;
        position: relative;
        color: #8a4f6d;
        margin-top: 14px;
      }
      @keyframes swing {
        0%,
        100% {
          transform: rotate(3deg);
        }
        50% {
          transform: rotate(-1.5deg);
        }
      }
      .rings {
        position: absolute;
        top: -12px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-evenly;
        padding: 0 14px;
      }
      .rings i {
        width: 9px;
        height: 26px;
        border-radius: 6px;
        background: linear-gradient(90deg, #b79ae8, #e6dafc);
        box-shadow: 0 2px 3px rgba(0, 0, 0, 0.18);
      }
      .calhead {
        background: linear-gradient(#ffb3d1, #ff8fb8);
        color: #fff;
        text-align: center;
        padding: 26px 0 10px;
        border-radius: 16px 16px 0 0;
        font: 700 1.9rem/1 var(--hand);
      }
      .calhead small {
        display: block;
        font: 700 0.8rem var(--sans);
        letter-spacing: 0.3em;
        margin-top: 5px;
        opacity: 0.95;
      }
      .cgrid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px 2px;
        padding: 12px 12px 6px;
        text-align: center;
        font: 700 0.85rem var(--sans);
      }
      .cgrid > * {
        position: relative;
        line-height: 30px;
        font-style: normal;
      }
      .cgrid em {
        color: #ff8fb8;
        font-size: 0.72rem;
      }
      .cgrid .mark {
        color: #e0407a;
      }
      .mark svg {
        position: absolute;
        left: -8px;
        top: -6px;
        width: calc(100% + 16px);
        height: calc(100% + 12px);
        overflow: visible;
        pointer-events: none;
      }
      .mark path {
        fill: none;
        stroke: #ff4f86;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: draw 1.2s ease 1.6s forwards;
      }
      .calnote {
        margin: 0;
        padding: 2px 0 14px;
        text-align: center;
        font: 700 1.25rem var(--hand);
        color: #e0407a;
      }

      /* sân khấu chính */
      .stage {
        width: min(1040px, 100%);
        margin: 0 auto;
        padding: 28px 16px;
        display: grid;
        grid-template-columns: 1fr 0fr;
        align-items: center;
        transition: grid-template-columns 1.1s ease, column-gap 1.1s ease;
        animation: fadeUp 0.8s ease both;
      }
      .stage.open {
        grid-template-columns: 1fr 1fr;
        column-gap: 20px;
      }
      .left {
        display: flex;
        justify-content: center;
        min-width: 0;
      }
      .stack {
        display: grid;
        place-items: center;
        width: 100%;
        position: relative;
      }
      .stack > * {
        grid-area: 1/1;
      }
      .envw {
        position: relative;
        width: 260px;
        height: 170px;
        cursor: pointer;
        outline-offset: 14px;
      }
      .envsvg {
        display: block;
        width: 260px;
        height: 170px;
        overflow: visible;
        filter: drop-shadow(0 12px 18px rgba(230, 110, 160, 0.3));
      }
      .stage:not(.open) .envsvg {
        animation: wiggle 2.6s ease-in-out infinite;
      }
      @keyframes wiggle {
        0%,
        40%,
        100% {
          transform: rotate(0);
        }
        10% {
          transform: rotate(-3deg);
        }
        20% {
          transform: rotate(3deg);
        }
        30% {
          transform: rotate(-2deg);
        }
      }
      .fc {
        transform-box: fill-box;
        transform-origin: top;
        transition: transform 0.45s ease 0.1s;
      }
      .fo {
        transform-box: fill-box;
        transform-origin: bottom;
        transform: scaleY(0);
        transition: transform 0.45s ease 0.35s;
      }
      .pap {
        transition: transform 0.8s ease 0.55s;
      }
      .seal {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 0.3s;
      }
      .open .fc {
        transform: scaleY(0);
      }
      .open .fo {
        transform: scaleY(1);
      }
      .open .pap {
        transform: translateY(-58px);
      }
      .open .seal {
        transform: scale(0);
      }
      .open .envw {
        pointer-events: none;
        animation: envOut 0.7s ease 1.5s both;
      }
      @keyframes envOut {
        to {
          opacity: 0;
          transform: translateY(14px) scale(0.8);
        }
      }
      .bubble {
        position: absolute;
        left: 50%;
        top: -74px;
        white-space: nowrap;
        background: #fff;
        color: #e0407a;
        font: 700 1.4rem var(--hand);
        padding: 8px 20px;
        border-radius: 22px;
        box-shadow: 0 8px 20px rgba(255, 120, 170, 0.3);
        animation: bub 1.6s ease-in-out infinite;
        transform: translateX(-50%);
      }
      .bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -8px;
        width: 16px;
        height: 16px;
        background: #fff;
        transform: translateX(-50%) rotate(45deg);
        border-radius: 0 0 4px 0;
      }
      @keyframes bub {
        50% {
          transform: translateX(-50%) translateY(-8px);
        }
      }
      .open .bubble {
        opacity: 0;
        transition: opacity 0.3s;
      }

      .burst {
        position: absolute;
        left: 50%;
        top: 50%;
        pointer-events: none;
        z-index: 2;
      }
      .burst span {
        position: absolute;
        font-size: 1.6rem;
        opacity: 0;
      }
      .open .burst span {
        animation: fly 2.4s ease-out 1.3s both;
      }
      @keyframes fly {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.3);
        }
        25% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) scale(1.1);
        }
      }

      /* thư */
      .letter {
        width: min(100%, 440px);
        background: var(--paper, #fffaf2);
        background-image: linear-gradient(180deg, #fffaf2, #fff1f7);
        border-radius: 10px;
        padding: 38px 30px 26px;
        color: #7a4a66;
        box-shadow: 0 18px 44px rgba(220, 120, 160, 0.3);
        transform: rotate(-1.2deg);
        transform-origin: 50% 100%;
        position: relative;
        border: 2px solid #ffe0ec;
      }
      .stage:not(.open) .letter {
        visibility: hidden;
      }
      .open .letter {
        animation: unfold 1s cubic-bezier(0.2, 0.9, 0.3, 1.1) 1.6s both;
      }
      @keyframes unfold {
        from {
          opacity: 0;
          transform: rotate(-1.2deg) scale(0.3) translateY(70px);
        }
        55% {
          opacity: 1;
        }
        to {
          opacity: 1;
          transform: rotate(-1.2deg);
        }
      }
      .tape {
        position: absolute;
        top: -13px;
        left: 50%;
        width: 120px;
        height: 28px;
        background: rgba(205, 184, 245, 0.75);
        transform: translateX(-50%) rotate(-3deg);
      }
      .letter h2 {
        font: 700 2.3rem/1.1 var(--hand);
        color: #e0407a;
        margin: 0 0 8px;
      }
      .letter p {
        font: 500 1.42rem/1.5 var(--hand);
        margin: 0.55em 0;
        opacity: 0;
      }
      .open .letter p {
        animation: fadeUp 0.9s ease both;
      }
      .letter .sign {
        text-align: right;
        font-weight: 700;
        margin-top: 18px;
      }
      .sign span {
        font: 700 2rem var(--hand);
        color: #e0407a;
      }

      /* hoa + bánh */
      .gift {
        min-width: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .pair {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        width: 100%;
        gap: 2%;
      }
      .bq {
        flex: 0 1 58%;
        max-width: 280px;
        height: auto;
        display: block;
      }
      .cake {
        flex: 0 1 40%;
        max-width: 200px;
        height: auto;
        display: block;
        margin-bottom: 6px;
        opacity: 0;
      }
      .open .cake {
        animation: cakeIn 1s cubic-bezier(0.2, 1.4, 0.4, 1) 3.3s both,
          bob 4s ease-in-out 4.4s infinite;
      }
      @keyframes cakeIn {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.5);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes bob {
        0%,
        100% {
          opacity: 1;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-7px);
        }
      }
      .pop {
        transform-box: fill-box;
        transform-origin: var(--o, 50% 50%);
        transform: scale(0);
      }
      .open .pop {
        animation: grow 0.9s cubic-bezier(0.2, 1.5, 0.4, 1) forwards;
      }
      .stem {
        fill: none;
        stroke: #8cc8a0;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .stem.th {
        stroke-width: 1.6;
      }
      .open .stem {
        animation: draw 1.1s ease forwards;
      }
      .sway {
        transform-box: fill-box;
        transform-origin: 50% 100%;
      }
      .open .sway {
        animation: sway 5s ease-in-out 5s infinite;
      }
      @keyframes sway {
        50% {
          transform: rotate(1.6deg);
        }
        0%,
        100% {
          transform: rotate(-1.6deg);
        }
      }
      .flame {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: flick 0.5s ease-in-out infinite alternate;
      }
      @keyframes flick {
        from {
          transform: scale(1, 1) rotate(-2deg);
        }
        to {
          transform: scale(0.88, 1.14) rotate(3deg);
        }
      }
      .tw {
        animation: tw 2s ease-in-out infinite;
      }
      @keyframes tw {
        50% {
          opacity: 0.2;
        }
      }
      .photo {
        margin: 0 0 16px;
        width: min(62%, 230px);
        background: #fff;
        padding: 10px 10px 6px;
        border-radius: 4px;
        box-shadow: 0 14px 30px rgba(200, 110, 160, 0.32);
        transform: rotate(3deg);
        position: relative;
        opacity: 0;
      }
      .open .photo {
        animation: drop 1s cubic-bezier(0.2, 1.3, 0.4, 1) 3.9s both;
      }
      @keyframes drop {
        from {
          opacity: 0;
          transform: translateY(-60px) rotate(-14deg) scale(0.8);
        }
        to {
          opacity: 1;
          transform: rotate(3deg);
        }
      }
      .ptape {
        position: absolute;
        top: -11px;
        left: 50%;
        width: 84px;
        height: 22px;
        background: rgba(255, 179, 209, 0.78);
        transform: translateX(-50%) rotate(2deg);
      }
      .pbox {
        position: relative;
        aspect-ratio: 1/1;
        overflow: hidden;
        background: #fff3f8;
        border-radius: 2px;
      }
      .pbox img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 35%;
        display: block;
      }
      .ph {
        position: absolute;
        inset: 6px;
        border: 2px dashed #ffb3d1;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font: 700 2.6rem/1 var(--sans);
        color: #ff8fb8;
      }
      .ph small {
        font: 700 1.2rem var(--hand);
        margin-top: 4px;
      }
      .pbox input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
      .photo figcaption {
        font: 700 1.3rem/1.3 var(--hand);
        color: #7a4a66;
        text-align: center;
        padding: 6px 0 4px;
      }
      .cap {
        font: 400 clamp(2.5rem, 6vw, 3.3rem) / 1.1 var(--fancy);
        color: #ff7fae;
        text-shadow: 0 2px 0 #fff;
        margin: 6px 0 0;
        text-align: center;
        opacity: 0;
      }
      .open .cap {
        animation: fadeUp 1s ease 4.3s both;
      }
      .cap small {
        display: block;
        font: 700 0.9rem var(--sans);
        letter-spacing: 0.3em;
        color: var(--ink);
        text-shadow: none;
        margin-top: 2px;
      }
      .again {
        align-self: center;
        margin: 6px 0 20px;
        background: none;
        border: 1px solid currentColor;
        color: var(--ink);
        border-radius: 99px;
        padding: 6px 18px;
        font: 700 0.85rem var(--sans);
        opacity: 0;
        cursor: pointer;
        animation: fadeUp 0.8s ease 6s both;
      }

      @media (max-width: 820px) {
        .stage,
        .stage.open {
          grid-template-columns: 1fr;
          column-gap: 0;
        }
        .gift {
          max-height: 0;
          transition: max-height 1.4s ease;
        }
        .stage.open .gift {
          max-height: 900px;
          margin-top: 12px;
        }
        .letter {
          padding: 34px 22px 22px;
        }
        .letter p {
          font-size: 1.3rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fl-wrap {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script>
      // ====== TÙY CHỈNH LỜI CHÚC Ở ĐÂY ======
      const CONFIG = {
        to: "Em yêu",
        from: "Anh",
        date: { day: 25, month: 10, year: 2026 },
        kicker: "Một ngày thật đặc biệt",
        intro: "Hôm nay là ngày của em ♡",
        hint: "Bấm vào đây nhé",
        message: [
          "Chúc mừng sinh nhật em, cô gái đáng yêu nhất của anh!",
          "Cảm ơn em đã đến bên anh, mang theo nắng ấm, tiếng cười và những ngày bình yên nhất.",
          "Mong tuổi mới của em thật nhiều niềm vui, thật nhiều điều ngọt ngào như chiếc bánh xoài này, và mọi ước mơ đều nở hoa như bó hoa em đang cầm trên tay.",
          "Anh sẽ luôn ở đây, nắm tay em đi thật xa.",
        ],
        sign: "Yêu diu thật nhiều,",
        // Ảnh kỷ niệm: để trống thì hiện ô "Thêm ảnh" (chọn ảnh để xem thử trên máy bạn).
        // Khi deploy: đặt ảnh cạnh index.html (ví dụ photo.jpg) rồi ghi photo: 'photo.jpg'
        photo: "IMG_5158.jpg",
        photoCaption: "♡ ♡ ♡",
      };
      // =====================================

      const { useState } = React;
      const h = React.createElement;

      const FLOATS = Array.from({ length: 16 }, (_, i) => ({
        l: (i * 37 + 9) % 100,
        s: 14 + ((i * 7) % 18),
        d: 11 + ((i * 5) % 9),
        dl: -(i * 1.9),
        e: ["🌸", "♡", "✦", "🌷", "♥", "✿"][i % 6],
      }));
      function Floats() {
        return h(
          "div",
          { className: "fl-wrap", "aria-hidden": true },
          FLOATS.map((f, i) =>
            h(
              "span",
              {
                key: i,
                className: "fl",
                style: {
                  left: f.l + "%",
                  fontSize: f.s,
                  animationDuration: f.d + "s",
                  animationDelay: f.dl + "s",
                },
              },
              f.e
            )
          )
        );
      }

      function Calendar() {
        const { day, month, year } = CONFIG.date;
        const first = (new Date(year, month - 1, 1).getDay() + 6) % 7;
        const n = new Date(year, month, 0).getDate();
        const cells = [];
        for (let i = 0; i < first; i++) cells.push(h("i", { key: "e" + i }));
        for (let d = 1; d <= n; d++) {
          cells.push(
            d === day
              ? h(
                  "b",
                  { key: d, className: "mark" },
                  d,
                  h(
                    "svg",
                    { viewBox: "0 0 60 52", "aria-hidden": true },
                    h("path", {
                      pathLength: 100,
                      d: "M30 4 C47 3 58 14 55 27 C52 41 33 48 17 43 C4 39 1 22 11 12 C17 6 26 4 38 5",
                    })
                  )
                )
              : h("span", { key: d }, d)
          );
        }
        return h(
          "div",
          { className: "cal" },
          h(

      const FL = [

        { x: 244, y: 176, r: 21, c: "#c3e4ff", s: "#86b9e8" },

      const LEAVES = [

        [176, 206, 30],
      ];
      const DOTS = [
        [44, 128],
        [258, 120],
        [78, 64],
        [228, 70],
        [118, 34],
        [184, 32],
      ];
      const stemD = (x, y, k) =>
        "M150 252 Q" +
        (150 + (x - 150) * 0.3) +
        " " +
        ((252 + y) / 2 + 16) +
        " " +
        x +
        " " +
        (y + k);

      function Flower({ x, y, r, c, s, i }) {
        const ps = [];
        for (let k = 0; k < 5; k++)
          ps.push(
            h("ellipse", {
              key: "a" + k,
              cy: -r * 0.55,
              rx: r * 0.46,
              ry: r * 0.62,
              fill: c,
              stroke: s,
              strokeWidth: 1.1,
              opacity: 0.92,
              transform: "rotate(" + k * 72 + ")",
            })
          );
        for (let k = 0; k < 5; k++)
          ps.push(
            h("ellipse", {
              key: "b" + k,
              cy: -r * 0.34,
              rx: r * 0.29,
              ry: r * 0.38,
              fill: "#fff",
              opacity: 0.38,
              transform: "rotate(" + (k * 72 + 36) + ")",
            })
          );
        return h(
          "g",
          { transform: "translate(" + x + " " + y + ")" },
          h(
            "g",
            {
              className: "pop",
              style: { animationDelay: 2.7 + i * 0.28 + "s" },
            },
            ps,
            h("circle", {
              r: r * 0.24,
              fill: "#ffe38f",
              stroke: "#f1b94a",
              strokeWidth: 1.2,
            }),
            h("circle", {
              r: r * 0.08,
              cx: -r * 0.07,
              cy: -r * 0.06,
              fill: "#fff6c7",
            })
          )
        );
      }

      function Bouquet() {
        return h(
          "svg",
          { className: "bq", viewBox: "0 0 300 340", "aria-label": "Bó hoa" },
          h(
            "defs",
            null,
            h(
              "filter",
              { id: "wc", x: "-10%", y: "-10%", width: "120%", height: "120%" },
              h("feTurbulence", {
                type: "fractalNoise",
                baseFrequency: 0.03,
                numOctaves: 2,
                seed: 4,
                result: "n",
              }),
              h("feDisplacementMap", {
                in: "SourceGraphic",
                in2: "n",
                scale: 5,
                xChannelSelector: "R",
                yChannelSelector: "G",
              })
            )
          ),
          h(
            "g",
            { className: "sway" },
            h(
              "g",
              { filter: "url(#wc)" },
              DOTS.map(([x, y], i) =>
                h("path", {
                  key: "ds" + i,
                  className: "stem th",
                  pathLength: 1,
                  d: stemD(x, y, 4),
                  style: { animationDelay: "2.1s" },
                })
              ),
              FL.map((f, i) =>
                h("path", {
                  key: "st" + i,
                  className: "stem",
                  pathLength: 1,
                  d: stemD(f.x, f.y, f.r * 0.3),
                  style: { animationDelay: 2.0 + i * 0.1 + "s" },
                })
              ),
              LEAVES.map(([x, y, a], i) =>
                h(
                  "g",
                  {
                    key: "lf" + i,
                    transform:
                      "translate(" + x + " " + y + ") rotate(" + a + ")",
                  },
                  h(
                    "g",
                    {
                      className: "pop",
                      style: {
                        "--o": "50% 100%",
                        animationDelay: 2.3 + i * 0.1 + "s",
                      },
                    },
                    h("ellipse", {
                      cy: -22,
                      rx: 10,
                      ry: 24,
                      fill: "#a8dcb9",
                      stroke: "#7fc09a",
                      strokeWidth: 1.2,
                    }),
                    h("path", {
                      d: "M0 0 V-40",
                      stroke: "#7fc09a",
                      strokeWidth: 1,
                    })
                  )
                )
              ),
              DOTS.map(([x, y], i) =>
                h(
                  "g",
                  {
                    key: "dt" + i,
                    transform: "translate(" + x + " " + y + ")",
                  },
                  h(
                    "g",
                    {
                      className: "pop",
                      style: { animationDelay: 3.5 + i * 0.1 + "s" },
                    },
                    h("circle", {
                      r: 4.5,
                      fill: "#fff",
                      stroke: "#cdb8f5",
                      strokeWidth: 1.2,
                    }),
                    h("circle", {
                      cx: 6,
                      cy: 3,
                      r: 3,
                      fill: "#fff",
                      stroke: "#cdb8f5",
                      strokeWidth: 1,
                    }),
                    h("circle", {
                      cx: -5,
                      cy: 4,
                      r: 3,
                      fill: "#fff",
                      stroke: "#cdb8f5",
                      strokeWidth: 1,
                    })
                  )
                )
              ),
              FL.map((f, i) =>
                h(Flower, Object.assign({ key: "fl" + i, i }, f))
              ),
              h(
                "g",
                {
                  className: "pop",
                  style: { "--o": "50% 0%", animationDelay: "1.9s" },
                },
                h("path", {
                  d: "M78 208 Q150 238 222 208 L172 322 Q150 332 128 322 Z",
                  fill: "#ffe0ec",
                  stroke: "#f3adc8",
                  strokeWidth: 1.5,
                }),
                h("path", {
                  d: "M92 214 Q150 242 208 214 L166 318 L150 328 Z",
                  fill: "#e6dafc",
                  opacity: 0.75,
                }),
                h("path", {
                  d: "M150 236 V326",
                  stroke: "#f3adc8",
                  strokeWidth: 1,
                })
              ),
              h(
                "g",
                { className: "pop", style: { animationDelay: "2.2s" } },
                h("ellipse", {
                  cx: 128,
                  cy: 254,
                  rx: 21,
                  ry: 10,
                  transform: "rotate(-18 128 254)",
                  fill: "#cdb8f5",
                  stroke: "#a98ddf",
                  strokeWidth: 1.5,
                }),
                h("ellipse", {
                  cx: 172,
                  cy: 254,
                  rx: 21,
                  ry: 10,
                  transform: "rotate(18 172 254)",
                  fill: "#cdb8f5",
                  stroke: "#a98ddf",
                  strokeWidth: 1.5,
                }),
                h("path", {
                  d: "M146 262 Q136 286 124 294 M154 262 Q164 286 176 294",
                  fill: "none",
                  stroke: "#a98ddf",
                  strokeWidth: 5,
                  strokeLinecap: "round",
                }),
                h("circle", { cx: 150, cy: 256, r: 8, fill: "#b79ae8" })
              )
            )
          )
        );
      }

      function Cake() {
        const ro = [];
        for (let k = 0; k <= 8; k++) {
          const t = (k * Math.PI) / 8;
          ro.push(
            h("circle", {
              key: k,
              cx: 110 + 73 * Math.cos(t),
              cy: 93 + 17 * Math.sin(t),
              r: 8.5,
              fill: "#fffaf3",
              stroke: "#ffc9dd",
              strokeWidth: 1.5,
            })
          );
        }
        const cubes = [
          [78, 88, -12],
          [94, 97, 6],
          [128, 97, -6],
          [144, 88, 12],
          [111, 101, 0],
        ];
        return h(
          "svg",
          {
            className: "cake",
            viewBox: "0 0 220 190",
            "aria-label": "Bánh mousse xoài",
          },
          h(
            "defs",
            null,
            h(
              "linearGradient",
              { id: "mg", x1: 0, y1: 0, x2: 0, y2: 1 },
              h("stop", { offset: 0, stopColor: "#ffd98a" }),
              h("stop", { offset: 1, stopColor: "#ffb85c" })
            ),
            h(
              "linearGradient",
              { id: "gl", x1: 0, y1: 0, x2: 0, y2: 1 },
              h("stop", { offset: 0, stopColor: "#ffd860" }),
              h("stop", { offset: 1, stopColor: "#ffb92f" })
            )
          ),
          h("ellipse", {
            cx: 110,
            cy: 162,
            rx: 100,
            ry: 20,
            fill: "#f1e4ff",
            stroke: "#dcc8f5",
            strokeWidth: 1.5,
          }),
          h("ellipse", { cx: 110, cy: 160, rx: 84, ry: 14, fill: "#fbf5ff" }),
          h("path", {
            d: "M32 92 V150 A78 20 0 0 0 188 150 V92 Z",
            fill: "url(#mg)",
            stroke: "#f2a24c",
            strokeWidth: 1.5,
          }),
          h("path", {
            d: "M32 128 V150 A78 20 0 0 0 188 150 V128 A78 20 0 0 1 32 128 Z",
            fill: "#fff0bf",
          }),
          h("path", {
            d: "M32 112 A78 20 0 0 0 188 112",
            fill: "none",
            stroke: "#fff",
            strokeWidth: 2,
            opacity: 0.6,
          }),
          h("ellipse", {
            cx: 110,
            cy: 92,
            rx: 78,
            ry: 20,
            fill: "url(#gl)",
            stroke: "#f0a63a",
            strokeWidth: 1.5,
          }),
          h("ellipse", {
            cx: 90,
            cy: 88,
            rx: 34,
            ry: 6,
            fill: "#fff",
            opacity: 0.35,
          }),
          cubes.map(([x, y, r], i) =>
            h("rect", {
              key: "c" + i,
              x: -7,
              y: -6,
              width: 14,
              height: 12,
              rx: 3,
              fill: "#ffa81f",
              stroke: "#ef8a00",
              strokeWidth: 1,
              transform: "translate(" + x + " " + y + ") rotate(" + r + ")",
            })
          ),
          h("ellipse", {
            rx: 9,
            ry: 4,
            fill: "#9ed9b4",
            transform: "translate(100 82) rotate(-28)",
          }),
          h("ellipse", {
            rx: 9,
            ry: 4,
            fill: "#8fd0a8",
            transform: "translate(122 82) rotate(28)",
          }),
          ro,
          h("rect", {
            x: 105,
            y: 58,
            width: 10,
            height: 30,
            rx: 3,
            fill: "#ffc2da",
          }),
          h("path", {
            d: "M105 68 L115 64 M105 76 L115 72 M105 84 L115 80",
            stroke: "#fff",
            strokeWidth: 2,
          }),
          h("circle", {
            cx: 110,
            cy: 46,
            r: 14,
            fill: "#ffe9a8",
            opacity: 0.45,
            className: "tw",
          }),
          h(
            "g",
            { className: "flame" },
            h("path", {
              d: "M110 34 C103 44 105 56 110 56 C115 56 117 44 110 34Z",
              fill: "#ffb347",
            }),
            h("path", {
              d: "M110 43 C107 48 108 54 110 54 C112 54 113 48 110 43Z",
              fill: "#fff3a3",
            })
          ),
          [
            [26, 62, 0],
            [196, 52, 0.6],
            [204, 112, 1.1],
          ].map(([x, y, d], i) =>
            h(
              "text",
              {
                key: "s" + i,
                x,
                y,
                fontSize: 16,
                fill: "#ffb3d1",
                className: "tw",
                style: { animationDelay: d + "s" },
              },
              "✦"
            )
          )
        );
      }

      function Photo() {
        const [src, setSrc] = useState(CONFIG.photo || "");
        const pick = (e) => {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = () => setSrc(r.result);
          r.readAsDataURL(f);
        };
        return h(
          "figure",
          { className: "photo" },
          h("i", { className: "ptape" }),
          h(
            "div",
            { className: "pbox" },
            src
              ? h("img", {
                  src,
                  alt: CONFIG.photoCaption || "Ảnh kỷ niệm",
                  onError: () => setSrc(""),
                })
              : [
                  h(
                    "span",
                    { key: "s", className: "ph" },
                    "+",
                    h("small", null, "Thêm ảnh")
                  ),
                  h("input", {
                    key: "i",
                    type: "file",
                    accept: "image/*",
                    onChange: pick,
                    "aria-label": "Chọn ảnh",
                  }),
                ]
          ),
          h("figcaption", null, CONFIG.photoCaption || "♡")
        );
      }

      const BURST = [
        "💗",
        "🌸",
        "✨",
        "💖",
        "🌷",
        "✨",
        "💗",
        "🌸",
        "💖",
        "✨",
      ].map((e, i) => ({
        e,
        dx: (i - 4.5) * 34,
        dy: -(90 + ((i * 37) % 100)),
      }));

      function App() {
        const [scene, setScene] = useState(0);
        const [open, setOpen] = useState(false);
        const go = () => setOpen(true);
        return h(
          React.Fragment,
          null,
          h(Floats),
          scene === 0
            ? h(Intro, {
                key: "i",
                onGo: () => {
                  setOpen(false);
                  setScene(1);
                },
              })
            : h(
                "main",
                { key: "m", className: "stage" + (open ? " open" : "") },
                h(
                  "div",
                  { className: "left" },
                  h(
                    "div",
                    { className: "stack" },
                    h(
                      "div",
                      {
                        className: "envw",
                        role: "button",
                        tabIndex: 0,
                        "aria-label": "Mở thư",
                        onClick: go,
                        onKeyDown: (e) => {
                          if (e.key === "Enter" || e.key === " ") go();
                        },
                      },
                      h("div", { className: "bubble" }, CONFIG.hint + " 💌"),
                      h(Envelope)
                    ),
                    h(
                      "div",
                      { className: "burst", "aria-hidden": true },
                      BURST.map((b, i) =>
                        h(
                          "span",
                          {
                            key: i,
                            style: {
                              "--dx": b.dx + "px",
                              "--dy": b.dy + "px",
                              animationDelay: 1.3 + i * 0.06 + "s",
                            },
                          },
                          b.e
                        )
                      )
                    ),
                    h(Letter)
                  )
                ),
                h(
                  "div",
                  { className: "gift" },
                  h(Photo),
                  h("div", { className: "pair" }, h(Bouquet), h(Cake)),
                  h(
                    "p",
                    { className: "cap" },
                    "Happy Birthday",
                    h(
                      "small",
                      null,
                      CONFIG.date.day +
                        " · " +
                        CONFIG.date.month +
                        " · " +
                        CONFIG.date.year
                    )
                  )
                )
              ),
          scene === 1 &&
            open &&
            h(
              "button",
              {
                className: "again",
                onClick: () => {
                  setOpen(false);
                  setScene(0);
                },
              },
              "↻ Xem lại từ đầu"
            )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
